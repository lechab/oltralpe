name: Deploy to Aruba
on:
  push:
    branches:
      - main
jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v7

      - name: 🟢 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 🖼️ Generate thumbnails & photo credits
        run: |
          npm install --no-save sharp exifr
          node scripts/thumbnails.mjs
          node scripts/credits.mjs

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ./oltralpe.it/
          # Options spécifiques pour éviter ECONNRESET sur Aruba :
          dangerous-clean-slate: false
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            .claude/**
            content/**
            scripts/**
