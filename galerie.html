<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>Oltralpe - Galleria foto</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link rel="stylesheet" href="assets/css/mm_health_nutr.css" type="text/css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
<link rel="shortcut icon" href="images/shared/favicon.gif" />
<script src="assets/js/common.js"></script>
<style type="text/css">
.link-archivio {
  display: inline-block;
  margin: 8px 0 14px 0;
  padding: 5px 14px 5px 10px;
  background: #f5f2ed;
  border-left: 4px solid #5C743D;
  border-radius: 2px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 13px;
  color: #5C743D;
  text-decoration: none;
  font-style: italic;
}
.link-archivio:hover {
  background: #e8e4dc;
  color: #336600;
}
</style>
</head>
<body dir="ltr">
<div align="center">
  <div id="header-container"></div>
  <table width="80%" border="0">
    <tr>
      <td width="17%" valign="top" bgcolor="#5C743D"><div id="nav-container"></div></td>
      <td valign="top" style="padding: 12px 16px;">

        <div align="center">
          <span class="Stile50" style="color:#336600;font-size:26px;font-weight:bold;font-family:Georgia,'Times New Roman',Times,serif;">
            Galleria foto delle attività d&apos;Oltr&apos;Alpe
          </span>
        </div>
        <div><a href="immagini.html" class="link-archivio">&#x1F4F7; Immagini del passato</a></div>
        <div id="gallery-filters" class="gallery-filters"></div>
        <div id="gallery-grid" class="gallery-grid"></div>

      </td>
    </tr>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
<script>
(function () {
  var LABELS = {
    uscita:    'Camminate',
    culturale: 'Evento culturale',
    assemblea: 'Assemblea'
  };

  var nameMth = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
                 'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

  function formatDate(iso) {
    if (!iso) return '';
    var parts = iso.split('-');
    if (parts.length < 3) return iso;
    var d = parseInt(parts[2], 10);
    var m = parseInt(parts[1], 10) - 1;
    var y = parts[0];
    return d + ' ' + nameMth[m] + ' ' + y;
  }

  function openAlbum(album) {
    if (!album.photos || album.photos.length === 0) return;
    var elements = album.photos.map(function (p) {
      return { href: p, type: 'image', title: '' };
    });
    var lb = GLightbox({ elements: elements, touchNavigation: true, loop: true });
    lb.open();
  }

  function renderGallery(albums) {
    var grid = document.getElementById('gallery-grid');
    if (!albums || albums.length === 0) {
      grid.innerHTML = '<p class="gallery-empty">Nessun album disponibile.</p>';
      return;
    }
    grid.innerHTML = albums.map(function (album, idx) {
      var cover = album.photos && album.photos.length > 0
        ? '<img class="album-cover" src="' + album.photos[0] + '" alt="' + album.title + '" />'
        : '<div class="album-cover-placeholder">&#128247;</div>';
      var badgeClass = album.event_type || 'uscita';
      var badgeLabel = LABELS[album.event_type] || album.event_type || '';
      var count = album.photos ? album.photos.length : 0;
      return '<div class="album-card" data-type="' + (album.event_type || '') + '" data-idx="' + idx + '">' +
        cover +
        '<div class="album-info">' +
          '<p class="album-title">' + album.title + '</p>' +
          '<p class="album-meta">' + formatDate(album.date) + (count ? ' &bull; ' + count + ' foto' : '') + '</p>' +
          '<span class="event-badge ' + badgeClass + '">' + badgeLabel + '</span>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function renderFilters(albums) {
    var bar = document.getElementById('gallery-filters');
    var types = [];
    albums.forEach(function (a) {
      if (a.event_type && types.indexOf(a.event_type) === -1) types.push(a.event_type);
    });
    var btns = '<button class="filter-btn active" data-filter="*">Tutte</button>';
    types.forEach(function (t) {
      btns += '<button class="filter-btn" data-filter="' + t + '">' + (LABELS[t] || t) + '</button>';
    });
    bar.innerHTML = btns;

    bar.addEventListener('click', function (e) {
      var btn = e.target.closest('.filter-btn');
      if (!btn) return;
      bar.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var filter = btn.getAttribute('data-filter');
      document.querySelectorAll('.album-card').forEach(function (card) {
        card.style.display = (filter === '*' || card.getAttribute('data-type') === filter) ? '' : 'none';
      });
    });
  }

  fetch('data/gallery.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var albums = data.albums || [];
      renderGallery(albums);
      if (albums.length > 0) renderFilters(albums);

      document.getElementById('gallery-grid').addEventListener('click', function (e) {
        var card = e.target.closest('.album-card');
        if (!card) return;
        var idx = parseInt(card.getAttribute('data-idx'), 10);
        openAlbum(albums[idx]);
      });
    })
    .catch(function () {
      document.getElementById('gallery-grid').innerHTML =
        '<p class="gallery-empty">Errore durante il caricamento della galleria.</p>';
    });

  buildHeader();
  buildNav();
})();
</script>
</body>
</html>
