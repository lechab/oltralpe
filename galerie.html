<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="it">
<head>
<title>Oltralpe - Galleria foto</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="assets/css/oltralpe.css" type="text/css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox@3.3.1/dist/css/glightbox.min.css" integrity="sha384-GPAzSuZc0kFvdIev6wm9zg8gnafE8tLso7rsAYQfc9hAdWCpOcpcNI5W9lWkYcsd" crossorigin="anonymous" />
<link rel="shortcut icon" href="images/shared/favicon.png" />
<script src="assets/js/common.js"></script>
<style type="text/css">
.link-archivio {
  display: inline-block;
  margin: 8px 0 14px 0;
  padding: 5px 14px 5px 10px;
  background: #f5f2ed;
  border-left: 4px solid #5C743D;
  border-radius: 2px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 13px;
  color: #5C743D;
  text-decoration: none;
  font-style: italic;
}
.link-archivio:hover {
  background: #e8e4dc;
  color: #336600;
}
</style>
</head>
<body dir="ltr">
<div align="center">
  <div id="header-container"></div>
  <table width="80%" border="0">
    <tr>
      <td width="17%" valign="top" bgcolor="#5C743D"><div id="nav-container"></div></td>
      <td valign="top" style="padding: 12px 16px;">

        <div align="center">
          <span class="Stile50" style="color:#336600;font-size:26px;font-weight:bold;font-family:Georgia,'Times New Roman',Times,serif;">
            Galleria foto delle attività d&apos;Oltr&apos;Alpe
          </span>
        </div>
        <div><a href="immagini.html" class="link-archivio">&#x1F4F7; Immagini del passato</a></div>
        <div id="gallery-filters"></div>
        <div id="gallery-grid" class="gallery-grid"></div>

      </td>
    </tr>
  </table>
</div>

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/glightbox@3.3.1/dist/js/glightbox.min.js" integrity="sha384-MZZbZ6RXJudK43v1qY1zOWKOU2yfeBPatuFoKyHAaAgHTUZhwblRTc9CphTt4IGQ" crossorigin="anonymous"></script>
<script type="text/javascript">
(function () {
  var LABELS = {
    uscita:    'Camminate',
    culturale: 'Evento culturale',
    assemblea: 'Assemblea',
    varie:     'Varie'
  };

  var allAlbums = [];
  var creditsMap = {};   // chemin photo -> crédit auteur extrait de l'EXIF (data/photo-credits.json)
  var state = { theme: '*', year: '*', location: '*', query: '' };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
      .replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function yearOf(iso) {
    return iso ? iso.split('-')[0] : '';
  }

  // Miniature générée par le CI (scripts/thumbnails.mjs) ; repli sur l'original si absente.
  function thumbUrl(src) {
    if (!src) return src;
    return src.indexOf('/images/uploads/') === 0
      ? src.replace('/images/uploads/', '/images/uploads/thumbs/')
      : src;
  }

  function openAlbum(album) {
    if (!album.photos || album.photos.length === 0) return;
    var photos = album.photos;
    // Crédit EXIF de la photo, sinon repli sur le champ « Réalisation » de l'album.
    var credits = photos.map(function (p) {
      return creditsMap[p] || album.credit || '';
    });
    var elements = photos.map(function (p) {
      return { href: p, type: 'image', title: '', description: '' };
    });
    var lb = GLightbox({ elements: elements, touchNavigation: true, loop: true });

    // Affiche le crédit auteur en surimpression dans la photo courante (ancré à l'image).
    function showCredit(i) {
      var media = document.querySelector('.glightbox-container .gslide.current .gslide-media');
      if (!media) return;
      var badge = media.querySelector('.gphoto-credit');
      var text = credits[i] || '';
      if (!text) { if (badge) badge.parentNode.removeChild(badge); return; }
      if (!badge) {
        badge = document.createElement('div');
        badge.className = 'gphoto-credit';
        media.appendChild(badge);
      }
      badge.innerHTML = '&#128247; ' + esc(text);
    }

    function currentIndex(data) {
      var i = (data && data.current && (data.current.slideIndex != null
               ? data.current.slideIndex : data.current.index));
      if (i == null) i = lb.index;
      return typeof i === 'number' ? i : 0;
    }

    lb.on('open', function () { showCredit(lb.index || 0); });
    lb.on('slide_changed', function (data) { showCredit(currentIndex(data)); });

    if (photos.length > 1) {
      var strip = null, thumbs = [];

      function setActive(i) {
        thumbs.forEach(function (t, j) {
          t.classList.toggle('active', j === i);
        });
        var cur = thumbs[i];
        if (cur && cur.scrollIntoView) {
          cur.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      }

      lb.on('open', function () {
        var container = document.querySelector('.glightbox-container');
        if (!container || container.querySelector('.gfilm')) return;
        strip = document.createElement('div');
        strip.className = 'gfilm';
        strip.addEventListener('click', function (e) { e.stopPropagation(); });
        thumbs = photos.map(function (p, i) {
          var t = document.createElement('button');
          t.type = 'button';
          t.className = 'gfilm-thumb';
          t.setAttribute('aria-label', 'Foto ' + (i + 1));
          var im = document.createElement('img');
          im.alt = '';
          im.loading = 'lazy';
          im.onerror = function () { im.onerror = null; im.src = p; };
          im.src = thumbUrl(p);
          t.appendChild(im);
          t.addEventListener('click', function (e) {
            e.stopPropagation();
            lb.goToSlide(i);
          });
          strip.appendChild(t);
          return t;
        });
        container.appendChild(strip);
        setActive(lb.index || 0);
      });

      lb.on('slide_changed', function (data) {
        var i = (data && data.current && (data.current.slideIndex != null
                 ? data.current.slideIndex : data.current.index));
        if (i == null) i = lb.index;
        if (typeof i === 'number') setActive(i);
      });
    }

    lb.open();
  }

  function renderGallery(albums) {
    var grid = document.getElementById('gallery-grid');
    if (!albums || albums.length === 0) {
      grid.innerHTML = '<p class="gallery-empty">Nessun album disponibile.</p>';
      return;
    }
    grid.innerHTML = albums.map(function (album, idx) {
      var coverSrc = album.cover || (album.photos && album.photos.length > 0 ? album.photos[0] : null);
      var cover = coverSrc
        ? '<img class="album-cover" src="' + esc(thumbUrl(coverSrc)) + '" data-full="' + esc(coverSrc) + '" loading="lazy" alt="' + esc(album.title) + '" />'
        : '<div class="album-cover-placeholder">&#128247;</div>';
      var badgeClass = album.event_type || 'uscita';
      var badgeLabel = LABELS[album.event_type] || album.event_type || '';
      var count = album.photos ? album.photos.length : 0;
      var meta = [formatDateIso(album.date), count ? count + ' foto' : '']
        .filter(function (x) { return x; }).join(' &bull; ');
      return '<div class="album-card"' +
          ' data-type="' + esc(album.event_type || '') + '"' +
          ' data-year="' + esc(yearOf(album.date)) + '"' +
          ' data-location="' + esc(album.location || '') + '"' +
          ' data-idx="' + idx + '">' +
        cover +
        '<div class="album-info">' +
          '<p class="album-title">' + esc(album.title) + '</p>' +
          (meta ? '<p class="album-meta">' + meta + '</p>' : '') +
          (album.location ? '<p class="album-location">&#128205; ' + esc(album.location) + '</p>' : '') +
          (album.credit ? '<p class="album-meta">&#128247; ' + esc(album.credit) + '</p>' : '') +
          (badgeLabel ? '<span class="event-badge ' + esc(badgeClass) + '">' + esc(badgeLabel) + '</span>' : '') +
        '</div>' +
      '</div>';
    }).join('');
  }

  function matches(card) {
    if (state.theme !== '*' && card.getAttribute('data-type') !== state.theme) return false;
    if (state.year !== '*' && card.getAttribute('data-year') !== state.year) return false;
    if (state.location !== '*' && card.getAttribute('data-location') !== state.location) return false;
    if (state.query) {
      var idx = parseInt(card.getAttribute('data-idx'), 10);
      var a = allAlbums[idx] || {};
      var hay = ((a.title || '') + ' ' + (a.location || '')).toLowerCase();
      if (hay.indexOf(state.query) === -1) return false;
    }
    return true;
  }

  function applyFilters() {
    document.querySelectorAll('#gallery-grid .album-card').forEach(function (card) {
      card.style.display = matches(card) ? '' : 'none';
    });
  }

  function buildBtn(label, value, active) {
    return '<button class="filter-btn' + (active ? ' active' : '') + '" data-value="' + esc(value) + '">' + esc(label) + '</button>';
  }

  function renderFilters(albums) {
    var types = [], years = [], locations = [];
    albums.forEach(function (a) {
      if (a.event_type && types.indexOf(a.event_type) === -1) types.push(a.event_type);
      var y = yearOf(a.date);
      if (y && years.indexOf(y) === -1) years.push(y);
      if (a.location && locations.indexOf(a.location) === -1) locations.push(a.location);
    });
    years.sort(function (a, b) { return parseInt(b, 10) - parseInt(a, 10); });
    locations.sort(function (a, b) { return a.localeCompare(b); });

    var html = '';

    html += '<div class="filter-group" id="filter-theme"><span class="filter-group-label">Tema</span>' + buildBtn('Tutte', '*', true);
    types.forEach(function (t) { html += buildBtn(LABELS[t] || t, t, false); });
    html += '</div>';

    html += '<div class="filter-group" id="filter-year"><span class="filter-group-label">Anno</span>' + buildBtn('Tutti', '*', true);
    years.forEach(function (y) { html += buildBtn(y, y, false); });
    html += '</div>';

    html += '<div class="filter-group" id="filter-extra">';
    if (locations.length > 0) {
      html += '<span class="filter-group-label">Luogo</span>' +
              '<select id="filter-location" class="filter-select"><option value="*">Tutti</option>';
      locations.forEach(function (l) { html += '<option value="' + esc(l) + '">' + esc(l) + '</option>'; });
      html += '</select>';
    }
    html += '<input type="text" id="filter-search" class="filter-search" placeholder="Cerca per titolo o luogo..." />';
    html += '</div>';

    var bar = document.getElementById('gallery-filters');
    bar.innerHTML = html;

    bar.addEventListener('click', function (e) {
      var btn = e.target.closest('.filter-btn');
      if (!btn) return;
      var group = btn.parentNode;
      group.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      if (group.id === 'filter-theme') state.theme = btn.getAttribute('data-value');
      if (group.id === 'filter-year')  state.year  = btn.getAttribute('data-value');
      applyFilters();
    });

    var locSel = document.getElementById('filter-location');
    if (locSel) {
      locSel.addEventListener('change', function () {
        state.location = locSel.value;
        applyFilters();
      });
    }

    var search = document.getElementById('filter-search');
    search.addEventListener('input', function () {
      state.query = search.value.trim().toLowerCase();
      applyFilters();
    });
  }

  Promise.all([
    fetch('data/gallery.json').then(function (r) { return r.json(); }),
    fetch('data/photo-credits.json')
      .then(function (r) { return r.ok ? r.json() : {}; })
      .catch(function () { return {}; })
  ])
    .then(function (res) {
      var data = res[0];
      creditsMap = res[1] || {};
      allAlbums = data.albums || [];
      renderGallery(allAlbums);
      if (allAlbums.length > 0) renderFilters(allAlbums);

      var gridEl = document.getElementById('gallery-grid');

      gridEl.addEventListener('click', function (e) {
        var card = e.target.closest('.album-card');
        if (!card) return;
        var idx = parseInt(card.getAttribute('data-idx'), 10);
        openAlbum(allAlbums[idx]);
      });

      // Repli sur l'image pleine résolution si la miniature n'existe pas encore.
      gridEl.addEventListener('error', function (e) {
        var img = e.target;
        if (img.tagName !== 'IMG' || !img.getAttribute('data-full') || img.dataset.fellBack) return;
        img.dataset.fellBack = '1';
        img.src = img.getAttribute('data-full');
      }, true);
    })
    .catch(function () {
      document.getElementById('gallery-grid').innerHTML =
        '<p class="gallery-empty">Errore durante il caricamento della galleria.</p>';
    });

  buildHeader();
  buildNav();
})();
</script>
</body>
</html>
