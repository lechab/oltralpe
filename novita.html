<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="it">
<head>
<title>Oltralpe Novit&agrave;</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="assets/css/oltralpe.css" type="text/css" />
<link rel="shortcut icon" href="images/shared/favicon.png" />
<script src="assets/js/common.js"></script>
</head>
<body class="page-novita" dir="ltr">
<div align="center">
  <div id="header-container"></div>
  <table width="80%" border="0">
    <tr>
      <td width="17%" valign="top" bgcolor="#5C743D"><div id="nav-container"></div></td>
      <td width="2%">&nbsp;</td>
      <td width="72%" valign="top">
        <div id="news-container"><p class="Stile31">Caricamento notizie...</p></div>
      </td>
    </tr>
  </table>
</div>

<script type="text/javascript">buildHeader();buildNav();</script>
<script type="text/javascript">
  function bodyToHtml(text) {
    if (!text) return '';
    return text.split(/\n\n+/).map(function(p) {
      return '<p class="Stile31">' + p.replace(/\n/g, '<br />') + '</p>';
    }).join('');
  }

  function typeBadge(type) {
    if (!type) return '';
    var labels = { camminata: 'Camminata', evento: 'Evento', varie: 'Varie' };
    return '<span class="news-type-badge ' + type + '">' + (labels[type] || type) + '</span><br />';
  }

  function camminateFiche(n) {
    if (n.type !== 'camminata') return '';
    var rows = [
      ['Data e ora',       n.data_camminata ? n.data_camminata.replace('T', ' ').slice(0, 16) : null],
      ['Partenza',         n.partenza],
      ['Lunghezza',        n.lunghezza ? n.lunghezza + ' km' : null],
      ['Dislivello',       n.dislivello ? n.dislivello + ' m' : null],
      ['Tempo di percorso', n.tempo_percorso]
    ];
    var html = '<table class="camminata-fiche"><tbody>';
    for (var i = 0; i < rows.length; i++) {
      if (rows[i][1]) html += '<tr><td>' + rows[i][0] + '</td><td>' + rows[i][1] + '</td></tr>';
    }
    return html + '</tbody></table>';
  }

  function videoEmbed(url) {
    if (!url) return '';
    var m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    if (!m) return '';
    return '<div style="margin:8px 0;"><iframe width="100%" height="315" src="https://www.youtube.com/embed/' + m[1] + '" frameborder="0" allowfullscreen="allowfullscreen"></iframe></div>';
  }

  fetch('data/news.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var items = (data.articles || []).slice().sort(function(a, b) {
        return (b.date || '').localeCompare(a.date || '');
      });
      if (items.length === 0) {
        document.getElementById('news-container').innerHTML =
          '<p class="Stile31">Nessuna notizia disponibile.</p>';
        return;
      }
      var html = '';
      for (var i = 0; i < items.length; i++) {
        var n = items[i];
        html +=
          '<div style="margin-bottom:16px; border-bottom:1px solid #C0CFE0; padding-bottom:12px;">' +
            typeBadge(n.type) +
            '<p class="Stile28">' + n.title + '</p>' +
            '<p class="Stile27">' + formatDateIso(n.date) + '</p>' +
            camminateFiche(n) +
            bodyToHtml(n.body) +
            (n.image ? '<p><img src="' + n.image + '" alt="' + n.title + '" style="max-width:100%;height:auto;" /></p>' : '') +
            videoEmbed(n.video_url) +
          '</div>';
      }
      document.getElementById('news-container').innerHTML = html;
    })
    .catch(function() {
      document.getElementById('news-container').innerHTML =
        '<p class="Stile31">Impossibile caricare le notizie.</p>';
    });
</script>
</body>
</html>
