<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<!-- DW6 -->
<head>
<title>Oltralpe Novit&agrave;</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<link rel="stylesheet" href="assets/css/mm_health_nutr.css" type="text/css" />
<link rel="shortcut icon" href="images/shared/favicon.gif" />
<script src="assets/js/common.js"></script>
<style type="text/css">
.Stile28 {
  color: #993300;
  font-weight: bold;
  font-size: 12px;
  font-family: Arial, Helvetica, sans-serif;
}
.Stile27 {
  color: #000000;
  font-size: 10px;
  font-family: Arial, Helvetica, sans-serif;
}
.Stile31 {
  font-size: 12px;
  color: #000000;
  font-family: Arial, Helvetica, sans-serif;
}
#news-container > div:last-child { border-bottom: none; padding-bottom: 0; }
.news-type-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 10px;
  font-family: Arial, Helvetica, sans-serif;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.news-type-badge.camminata { background: #d4edda; color: #2d6a3f; }
.news-type-badge.evento    { background: #cce5ff; color: #004085; }
.news-type-badge.varie     { background: #f0f0f0; color: #555; }
.camminata-fiche {
  display: table;
  border-collapse: separate;
  border-spacing: 0;
  margin: 10px 0 14px 0;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 14px;
  background: #ffffff;
  border: 1px solid #c8debb;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(92,116,61,0.10);
  min-width: 280px;
}
.camminata-fiche td {
  padding: 9px 16px;
  border-bottom: 1px solid #e8f0e0;
  vertical-align: middle;
}
.camminata-fiche td:first-child {
  font-weight: bold;
  color: #5C743D;
  white-space: nowrap;
  background: #f4f8ef;
  width: 160px;
}
.camminata-fiche tr:last-child td { border-bottom: none; }
.camminata-fiche tr:first-child td:first-child { border-radius: 8px 0 0 0; }
.camminata-fiche tr:first-child td:last-child  { border-radius: 0 8px 0 0; }
.camminata-fiche tr:last-child  td:first-child { border-radius: 0 0 0 8px; }
.camminata-fiche tr:last-child  td:last-child  { border-radius: 0 0 8px 0; }
</style>
</head>
<body dir="ltr">
<div align="center">
  <div id="header-container"></div>
  <table width="80%" border="0">
    <tr>
      <td width="17%" valign="top" bgcolor="#5C743D"><div id="nav-container"></div></td>
      <td width="2%">&nbsp;</td>
      <td width="72%" valign="top">
        <div id="news-container"><p class="Stile31">Caricamento notizie...</p></div>
      </td>
    </tr>
  </table>
</div>

<script type="text/javascript">buildHeader();buildNav();</script>
<script type="text/javascript">
  var nameMth = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
                 'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

  function formatDate(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    if (p.length < 3) return iso;
    return parseInt(p[2], 10) + ' ' + nameMth[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }

  function bodyToHtml(text) {
    if (!text) return '';
    return text.split(/\n\n+/).map(function(p) {
      return '<p class="Stile31">' + p.replace(/\n/g, '<br />') + '</p>';
    }).join('');
  }

  function typeBadge(type) {
    if (!type) return '';
    var labels = { camminata: 'Camminata', evento: 'Evento', varie: 'Varie' };
    return '<span class="news-type-badge ' + type + '">' + (labels[type] || type) + '</span><br />';
  }

  function camminateFiche(n) {
    if (n.type !== 'camminata') return '';
    var rows = [
      ['Data e ora',       n.data_camminata ? n.data_camminata.replace('T', ' ').slice(0, 16) : null],
      ['Partenza',         n.partenza],
      ['Lunghezza',        n.lunghezza ? n.lunghezza + ' km' : null],
      ['Dislivello',       n.dislivello ? n.dislivello + ' m' : null],
      ['Tempo di percorso', n.tempo_percorso]
    ];
    var html = '<table class="camminata-fiche"><tbody>';
    for (var i = 0; i < rows.length; i++) {
      if (rows[i][1]) html += '<tr><td>' + rows[i][0] + '</td><td>' + rows[i][1] + '</td></tr>';
    }
    return html + '</tbody></table>';
  }

  function videoEmbed(url) {
    if (!url) return '';
    var m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    if (!m) return '';
    return '<div style="margin:8px 0;"><iframe width="100%" height="315" src="https://www.youtube.com/embed/' + m[1] + '" frameborder="0" allowfullscreen="allowfullscreen"></iframe></div>';
  }

  fetch('data/news.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var items = (data.articles || []).slice().sort(function(a, b) {
        return (b.date || '').localeCompare(a.date || '');
      });
      if (items.length === 0) {
        document.getElementById('news-container').innerHTML =
          '<p class="Stile31">Nessuna notizia disponibile.</p>';
        return;
      }
      var html = '';
      for (var i = 0; i < items.length; i++) {
        var n = items[i];
        html +=
          '<div style="margin-bottom:16px; border-bottom:1px solid #C0CFE0; padding-bottom:12px;">' +
            typeBadge(n.type) +
            '<p class="Stile28">' + n.title + '</p>' +
            '<p class="Stile27">' + formatDate(n.date) + '</p>' +
            camminateFiche(n) +
            bodyToHtml(n.body) +
            (n.image ? '<p><img src="' + n.image + '" alt="' + n.title + '" style="max-width:100%;height:auto;" /></p>' : '') +
            videoEmbed(n.video_url) +
          '</div>';
      }
      document.getElementById('news-container').innerHTML = html;
    })
    .catch(function() {
      document.getElementById('news-container').innerHTML =
        '<p class="Stile31">Impossibile caricare le notizie.</p>';
    });
</script>
</body>
</html>
