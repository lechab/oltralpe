<script type="text/javascript">
  var BLUDIT_API = 'novita-api.php';
  var BLUDIT_BASE = 'https://www.oltralpe.it/backend';

  function loadNews() {
    fetch(BLUDIT_API)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var items = data.data;
        if (!items || items.length === 0) {
          document.getElementById('news-container').innerHTML =
            '<p class="Stile31">Nessuna notizia disponibile.</p>';
          return;
        }
        var html = '';
        for (var i = 0; i < items.length; i++) {
          var n = items[i];
          html +=
            '<div style="margin-bottom:16px; border-bottom:1px solid #C0CFE0; padding-bottom:12px;">' +
              '<p class="Stile28">' + n.title + '</p>' +
              '<p class="Stile27">' + n.date + '</p>' +
              '<p class="Stile31">' + (n.description || n.content || '') + '</p>' +
              '<a class="Stile46" href="' + BLUDIT_BASE + '/' + n.key + '">Leggi tutto &raquo;</a>' +
            '</div>';
        }
        document.getElementById('news-container').innerHTML = html;
      })
      .catch(function() {
        document.getElementById('news-container').innerHTML =
          '<p class="Stile31">Impossibile caricare le notizie.</p>';
      });
  }

  loadNews();
</script>
