<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oltralpe – Associazione</title>
  <link rel="stylesheet" href="assets/css/mm_health_nutr.css" type="text/css" />
  <link rel="shortcut icon" href="images/shared/favicon.gif" />
  <script src="assets/js/common.js"></script>
  <style type="text/css">
    .Stile46 { font-family: Geneva, Arial, Helvetica, sans-serif; font-size: 12px; font-weight: bold; color: #006600; }

    #assoc-content h2 { color: #336600; font-size: 1.2em; margin-top: 1.4em; border-bottom: 1px solid #99CC66; padding-bottom: 4px; }
    #assoc-content .subtitle { color: #990000; font-weight: bold; font-size: 1em; margin: 0; }
    #assoc-content .adresse { color: #006600; font-size: 0.9em; margin: 4px 0 16px; }
    #assoc-content .role-line { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dotted #c8e6b0; }
    #assoc-content .role-label { color: #006600; font-weight: bold; font-size: 0.9em; }
    #assoc-content .role-name { color: #990000; font-weight: bold; }
    #assoc-content .consiglieri-list { list-style: none; padding: 0; margin: 10px 0; }
    #assoc-content .consiglieri-list li { color: #006600; font-weight: bold; padding: 4px 0; border-bottom: 1px dotted #c8e6b0; }
    #assoc-content .soci { margin-top: 1.2em; color: #006600; font-weight: bold; }
  </style>
</head>
<body dir="ltr">
<div align="center">

  <!-- En-tête -->
  <div id="header-container"></div>

  <!-- Contenu principal : nav + page -->
  <table width="80%" border="0" cellpadding="0" cellspacing="0">
    <tr>
      <td width="17%" valign="top" bgcolor="#5C743D"><div id="nav-container"></div></td>
      <td width="3%">&nbsp;</td>
      <td width="56%" valign="top" style="padding: 10px 0;">
        <div id="assoc-content">
          <p class="subtitle">Associazione di Volontariato Oltr'Alpe</p>
          <p class="adresse">via Matteotti, 1 — 40063 Monghidoro BO — C.F. 91207050377</p>
          <p style="color:#666;font-size:11px;">Caricamento...</p>
        </div>
      </td>
      <td width="24%" valign="top" style="padding-top: 10px;">
        <img width="192" height="388" src="images/associazione/caderossi.jpg" alt="ca" />
        <br /><br />
        <img width="193" height="357" src="images/associazione/cristalli.jpg" alt="cri" />
      </td>
    </tr>
  </table>

  <!-- Pied de page -->
  <table width="80%" border="1" cellpadding="0" cellspacing="0">
    <tr><td bgcolor="#99CC66" style="height: 8px;">&nbsp;</td></tr>
  </table>

</div>

<script type="text/javascript">buildHeader();buildNav();</script>
<script type="text/javascript">
  fetch('data/associazione.json')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var consiglieri = (d.consiglieri || []).map(function(n) {
        return '<li>' + n + '</li>';
      }).join('');
      document.getElementById('assoc-content').innerHTML =
        '<p class="subtitle">Associazione di Volontariato Oltr\'Alpe</p>' +
        '<p class="adresse">via Matteotti, 1 — 40063 Monghidoro BO — C.F. 91207050377</p>' +
        '<h2>Struttura Organizzativa</h2>' +
        '<div class="role-line"><span class="role-label">Presidente Onorario</span><span class="role-name">' + d.presidente_onorario + '</span></div>' +
        '<div class="role-line"><span class="role-label">Presidente</span><span class="role-name">' + d.presidente + '</span></div>' +
        '<div class="role-line"><span class="role-label">Vice Presidente</span><span class="role-name">' + d.vice_presidente + '</span></div>' +
        '<h2>Consiglieri</h2>' +
        '<ul class="consiglieri-list">' + consiglieri + '</ul>' +
        '<p class="soci">Alla data odierna i soci sono ' + d.num_soci + '</p>';
    });
</script>
</body>
</html>
