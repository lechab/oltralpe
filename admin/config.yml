backend:
  name: github
  repo: lechab/oltralpe
  branch: main

site_url: https://www.oltralpe.it
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "news"
    label: "Novità"
    files:
      - label: "Articles"
        name: "news"
        file: "data/news.json"
        fields:
          - label: "Articles"
            name: "articles"
            widget: list
            summary: "{{fields.title}} ({{fields.date}})"
            fields:
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
              - label: "Tipo"
                name: "type"
                widget: select
                options:
                  - {label: "Camminata", value: "camminata"}
                  - {label: "Evento", value: "evento"}
                  - {label: "Varie", value: "varie"}
                required: false
              - {label: "Data e ora", name: "data_camminata", widget: "datetime", format: "YYYY-MM-DD HH:mm", time_format: "HH:mm", required: false, condition: {field: type, value: camminata}}
              - {label: "Partenza", name: "partenza", widget: "string", required: false, condition: {field: type, value: camminata}}
              - {label: "Lunghezza (km)", name: "lunghezza", widget: "string", required: false, condition: {field: type, value: camminata}}
              - {label: "Dislivello (m)", name: "dislivello", widget: "string", required: false, condition: {field: type, value: camminata}}
              - {label: "Tempo di percorso", name: "tempo_percorso", widget: "string", required: false, condition: {field: type, value: camminata}}
              - {label: "Contenu", name: "body", widget: "text"}
              - {label: "Image", name: "image", widget: "image", required: false}
              - {label: "Lien vidéo (YouTube)", name: "video_url", widget: "string", required: false}

  - name: "associazione"
    label: "Associazione"
    files:
      - label: "Informations"
        name: "associazione"
        file: "data/associazione.json"
        fields:
          - {label: "Presidente Onorario", name: "presidente_onorario", widget: "string"}
          - {label: "Presidente", name: "presidente", widget: "string"}
          - {label: "Vice Presidente", name: "vice_presidente", widget: "string"}
          - label: "Consiglieri"
            name: "consiglieri"
            widget: list
            field: {label: "Nome", name: "nome", widget: "string"}
          - {label: "Numero di soci", name: "num_soci", widget: "number", value_type: "int"}
          - {label: "Dernière mise à jour", name: "last_updated", widget: "datetime", format: "YYYY-MM-DD", time_format: false}

  - name: "galerie"
    label: "Galleria"
    files:
      - label: "Albums foto"
        name: "gallery"
        file: "data/gallery.json"
        fields:
          - label: "Albums"
            name: "albums"
            widget: list
            required: false
            min: 0
            summary: "{{fields.title}} — {{fields.event_type}}"
            fields:
              - {label: "Titolo", name: "title", widget: "string"}
              - label: "Typo eventi"
                name: "event_type"
                widget: select
                options:
                  - {label: "Camminate", value: "uscita"}
                  - {label: "Evento culturale", value: "culturale"}
                  - {label: "Assemblea", value: "assemblea"}
                  - {label: "Varie", value: "varie"}
              - {label: "Data", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
              - {label: "Luogo", name: "location", widget: "string", required: false}
              - {label: "Autore", name: "credit", widget: "string", required: false}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "Anteprima", name: "cover", widget: "image", required: false}
              - label: "Foto"
                name: "photos"
                widget: image
                multiple: true
                required: false

  - name: "filmati"
    label: "Filmati"
    files:
      - label: "Video"
        name: "filmati"
        file: "data/filmati.json"
        fields:
          - label: "Video"
            name: "videos"
            widget: list
            summary: "{{fields.title}} ({{fields.year}})"
            fields:
              - {label: "Titolo", name: "title", widget: "string"}
              - {label: "Link video (YouTube)", name: "url", widget: "string"}
              - {label: "Anno", name: "year", widget: "string"}
              - {label: "Luogo", name: "location", widget: "string", required: false}
              - label: "Tema"
                name: "theme"
                widget: select
                options:
                  - {label: "Camminata", value: "camminata"}
                  - {label: "Evento", value: "evento"}
                  - {label: "Racconti", value: "racconti"}
              - {label: "Réalisation", name: "credit", widget: "string", required: false}
              - {label: "Description", name: "description", widget: "text", required: false}
