backend:
  name: github
  repo: lechab/oltralpe
  branch: main

site_url: https://www.oltralpe.it
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "news"
    label: "Novità"
    folder: "content/news"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Image de couverture", name: "image", widget: "image"}
      - {label: "Contenu", name: "body", widget: "markdown"}

  - name: "galerie"
    label: "Galerie"
    files:
      - label: "Albums photos"
        name: "gallery"
        file: "data/gallery.json"
        fields:
          - label: "Albums"
            name: "albums"
            widget: list
            summary: "{{fields.title}} — {{fields.event_type}}"
            fields:
              - {label: "Titre", name: "title", widget: "string"}
              - label: "Type d'événement"
                name: "event_type"
                widget: select
                options:
                  - {label: "Uscita / Randonnée", value: "uscita"}
                  - {label: "Evento culturale", value: "culturale"}
                  - {label: "Assemblea", value: "assemblea"}
              - {label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
              - {label: "Description", name: "description", widget: "text", required: false}
              - label: "Photos"
                name: "photos"
                widget: list
                fields:
                  - {label: "Image", name: "image", widget: "image"}
                  - {label: "Légende", name: "caption", widget: "string", required: false}
